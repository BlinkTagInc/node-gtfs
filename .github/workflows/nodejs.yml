name: Node CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and typecheck
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run generated:check
      - run: pnpm run docs:check
      - run: pnpm run typecheck
        env:
          CI: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            color: '0'
          - node: 24
            color: '1'
          - node: 26
            color: '1'
    name: Use Node.js ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      - run: pnpm run build
        env:
          CI: true
      - run: node scripts/run-tests.mjs
        env:
          CI: true
          FORCE_COLOR: ${{ matrix.color }}

  database-test:
    runs-on: ubuntu-latest
    name: PostgreSQL and MySQL integration
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gtfs
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gtfs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gtfs
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - run: pnpm run test:databases
        env:
          GTFS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/gtfs
          GTFS_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/gtfs

  release-test:
    runs-on: ubuntu-latest
    name: Packed package and compatibility
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - run: pnpm run test:release

  minimum-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    name: Installed package on Node.js 22.18.0 (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7

      - name: Build with contributor tooling
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - run: pnpm run build
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Select the exact minimum package runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0

      - run: node scripts/check-runtime.mjs "$RUNNER_TEMP"/gtfs-*.tgz
